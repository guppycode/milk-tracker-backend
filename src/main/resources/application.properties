spring.application.name=milk-tracker

server.port=8081

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/milk_tracker}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:milk_tracker}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

audit.storage.type=jpa

core.security.allowed-origins=${CORE_SECURITY_ALLOWED_ORIGINS:https://milk.guppycode.com}

core.security.mode=AUTO

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${CORE_IDP_JWK_SET_URI:http://keycloak:8080/realms/milk-tracker/protocol/openid-connect/certs}
